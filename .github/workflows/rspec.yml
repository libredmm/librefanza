name: Rspec

on: push

env:
  RAILS_ENV: test
  PGHOST: localhost
  PGPORT: 5432
  PGDATABASE: postgres
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:12.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
    - name: Install JS dependencies
      run: bun install --frozen
    - name: Build assets
      run: |
        bun run build
        bun run build:css
    - name: Prepare database
      run: bundle exec rails db:prepare
    - name: Run tests
      run: bundle exec rspec

name: Docker

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/libredmm/librefanza:latest
          ghcr.io/libredmm/librefanza:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
